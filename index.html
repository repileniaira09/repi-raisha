<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Teknik Komputer & Jaringan - CRUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff1f2;
  --kartu: #ffffff;
  --teks: #4c0519;
  --teks-redup: #9f1239;
  --garis: #fecdd3;
  --aksen: #db2777; /* Warna utama Pink */
  --bahaya: #dc2626;
  --bahaya-hover: #b91c1c;
  --sukses: #16a34a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f1017;
    --kartu: #2a121d;
    --teks: #ffe4e6;
    --teks-redup: #fda4af;
    --garis: #501d32;
    --aksen: #f472b6; /* Warna utama Pink (Dark Mode) */
    --bahaya: #ef4444;
    --bahaya-hover: #dc2626;
    --sukses: #22c55e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--teks);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
.wadah { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
header h1 { margin: 0 0 4px; font-size: 1.75rem; font-weight: 800; }
header p { margin: 0; color: var(--teks-redup); }

.baris-atas {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.kontrol { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 8px; }
.kontrol input, .kontrol select, .tombol-aksi, .form-grup input, .form-grup select {
  font: inherit;
  color: var(--teks);
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 10px;
  padding: 10px 12px;
}
.kontrol input { flex: 1 1 220px; }
.kontrol select { flex: 0 1 160px; }
.kontrol input:focus-visible, .kontrol select:focus-visible, .form-grup input:focus, .form-grup select:focus {
  outline: 2px solid var(--aksen);
  outline-offset: 1px;
}

/* Tombol CSS */
.btn {
  font: inherit;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.9; }
.btn-primary { background: var(--aksen); color: #fff; }
.btn-danger { background: var(--bahaya); color: #fff; }
.btn-secondary { background: var(--garis); color: var(--teks); }

.jumlah { color: var(--teks-redup); font-size: 0.9rem; margin: 0 0 16px; }
.daftar {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.kartu {
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pita { height: 56px; background: var(--aksen); }
.isi { padding: 0 16px 16px; text-align: center; flex: 1; }
.foto {
  width: 76px; height: 76px;
  margin: -38px auto 8px;
  border-radius: 50%;
  border: 4px solid var(--kartu);
  background: #fce7f3;
  color: var(--aksen);
  display: grid; place-items: center; font-weight: 800; font-size: 1.5rem; overflow: hidden;
}
.foto img { width: 100%; height: 100%; object-fit: cover; }
.nama { margin: 0; font-size: 1.05rem; font-weight: 800; }
.nis { margin: 0 0 12px; color: var(--teks-redup); font-size: 0.85rem; }
.rincian { margin: 0; text-align: left; font-size: 0.9rem; }
.rincian div {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 6px 0; border-top: 1px solid var(--garis);
}
.rincian dt { color: var(--teks-redup); }
.rincian dd { margin: 0; font-weight: 600; text-align: right; }

.aksi-kartu {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: rgba(0,0,0,0.02);
  border-top: 1px solid var(--garis);
}
.aksi-kartu .btn { flex: 1; font-size: 0.85rem; padding: 6px; }

.pesan { grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--teks-redup); }
.pesan.galat { color: var(--bahaya); }

/* Modal Styling */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  padding: 16px;
}
.modal-overlay.aktif {
  opacity: 1;
  pointer-events: auto;
}
.modal {
  background: var(--kartu);
  border-radius: 14px;
  width: 100%;
  max-width: 480px;
  padding: 24px;
  box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
  max-height: 90vh;
  overflow-y: auto;
}
.modal h2 { margin: 0 0 16px; font-size: 1.25rem; }
.form-grup { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.form-grup label { font-size: 0.85rem; font-weight: 600; color: var(--teks-redup); }
.form-grup input, .form-grup select { width: 100%; }
.modal-aksi { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
</style>
</head>
<body>
<div class="wadah">
  <div class="baris-atas">
    <header>
      <h1>Teknik Komputer & Jaringan</h1>
      <p>Data Guru & Siswa</p>
    </header>
    <button id="btnTambah" class="btn btn-primary">+ Tambah Data Guru/Siswa</button>
  </div>

  <!-- KONTROL / FILTER -->
  <div class="kontrol">
    <input id="cari" type="search" placeholder="Cari nama atau NIS/NIP..." aria-label="Cari nama atau NIS/NIP">
    
    <select id="filterTipe" aria-label="Filter Guru atau Siswa">
      <option value="siswa">Siswa</option>
      <option value="guru">Guru</option>
    </select>

    <select id="filterKelas" aria-label="Filter Kelas">
      <option value="">Semua kelas</option>
    </select>

    <select id="filterMapel" aria-label="Filter Mapel">
      <option value="">Mapel</option>
    </select>
  </div>

  <p id="jumlah" class="jumlah" aria-live="polite"></p>
  <main id="daftar" class="daftar"></main>
</div>
  
<!-- MODAL FORM (CREATE & UPDATE) -->
<div id="modalForm" class="modal-overlay">
  <div class="modal">
    <h2 id="modalJudul">Tambah Data</h2>
    <form id="formSiswa">
      <input type="hidden" id="siswaIdOriginal">
      <div class="form-grup">
        <label for="inputNis" id="labelNis">NIS / NIP *</label>
        <input type="text" id="inputNis" required>
      </div>
      <div class="form-grup">
        <label for="inputNama">Nama Lengkap *</label>
        <input type="text" id="inputNama" required>
      </div>
      <div class="form-grup" id="grupKelas">
        <label for="inputKelas">Kelas *</label>
        <input type="text" id="inputKelas" placeholder="Contoh: XI TKJ 1">
      </div>
      <div class="form-grup">
        <label for="inputMapel">Mata Pelajaran / Keahlian *</label>
        <input type="text" id="inputMapel" required placeholder="Contoh: Administrasi Server">
      </div>
      <div class="form-grup">
        <label for="inputJK">Jenis Kelamin</label>
        <select id="inputJK">
          <option value="">-- Pilih --</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
      </div>
      <div class="form-grup" id="grupTglLahir">
        <label for="inputTglLahir">Tanggal Lahir</label>
        <input type="date" id="inputTglLahir">
      </div>
      <div class="form-grup" id="grupAlamat">
        <label for="inputAlamat">Alamat</label>
        <input type="text" id="inputAlamat">
      </div>
      <div class="form-grup" id="grupFoto">
        <label for="inputFoto">URL Foto</label>
        <input type="url" id="inputFoto" placeholder="https://example.com/foto.jpg">
      </div>
      <div class="modal-aksi">
        <button type="button" id="btnBatal" class="btn btn-secondary">Batal</button>
        <button type="submit" id="btnSimpan" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// --- KONFIGURASI SUPABASE ---
const SUPABASE_URL = "https://dfyjmumlvlfntywuiurq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_bp2EY0MmVwJTI3OyfT2dMw_ht5lNLCI";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// DOM Elements
const elDaftar = document.getElementById("daftar");
const elJumlah = document.getElementById("jumlah");
const elCari = document.getElementById("cari");
const elKelas = document.getElementById("filterKelas");
const elMapel = document.getElementById("filterMapel");
const elTipe = document.getElementById("filterTipe");

const modalForm = document.getElementById("modalForm");
const modalJudul = document.getElementById("modalJudul");
const formSiswa = document.getElementById("formSiswa");
const btnTambah = document.getElementById("btnTambah");
const btnBatal = document.getElementById("btnBatal");

// Form Inputs
const inputNis = document.getElementById("inputNis");
const inputNama = document.getElementById("inputNama");
const inputKelas = document.getElementById("inputKelas");
const inputMapel = document.getElementById("inputMapel");
const inputJK = document.getElementById("inputJK");
const inputTglLahir = document.getElementById("inputTglLahir");
const inputAlamat = document.getElementById("inputAlamat");
const inputFoto = document.getElementById("inputFoto");
const siswaIdOriginal = document.getElementById("siswaIdOriginal");

const grupKelas = document.getElementById("grupKelas");
const grupTglLahir = document.getElementById("grupTglLahir");
const grupAlamat = document.getElementById("grupAlamat");
const grupFoto = document.getElementById("grupFoto");
const labelNis = document.getElementById("labelNis");

let semuaData = [];

// --- READ DATA ---
async function muatData() {
  tampilkanPesan("Memuat data...");
  const tipeAktif = elTipe.value || "siswa";

  const { data, error } = await db
    .from(tipeAktif)
    .select("*")
    .order("nama");

  if (error) {
    console.error("Detail Error:", error);
    tampilkanPesan("Data tidak bisa dimuat. Periksa kebijakan (RLS) di Supabase.", true);
    return;
  }
  semuaData = data;
  isiPilihanKelas();
  isiPilihanMapel();
  tampilkanData();
}

function tampilkanData() {
  const kataKunci = elCari.value.trim().toLowerCase();
  const kelasDipilih = elKelas.value;
  const mapelDipilih = elMapel.value;
  const tipeAktif = elTipe.value;

  const hasil = semuaData.filter((s) => {
    const cocokKelas = tipeAktif === "guru" ? true : (!kelasDipilih || s.kelas === kelasDipilih);
    const cocokMapel = !mapelDipilih || s.mata_pelajaran === mapelDipilih;
    const idUnik = s.nis || s.nip || "";
    const cocokCari = !kataKunci || s.nama.toLowerCase().includes(kataKunci) || idUnik.toLowerCase().includes(kataKunci);
    return cocokKelas && cocokMapel && cocokCari;
  });

  elJumlah.textContent = hasil.length + " dari " + semuaData.length + " data";
  elDaftar.replaceChildren();

  if (hasil.length === 0) {
    tampilkanPesan(semuaData.length === 0 ? "Belum ada data." : "Tidak ada data yang cocok.");
    return;
  }

  hasil.forEach((s) => elDaftar.appendChild(buatKartu(s, tipeAktif)));
}

function buatKartu(s, tipe) {
  const kartu = el("article", "kartu");
  kartu.appendChild(el("div", "pita"));
  const isi = el("div", "isi");

  const foto = el("div", "foto");
  if (s.foto_url) {
    const gambar = document.createElement("img");
    gambar.src = s.foto_url;
    gambar.alt = "Foto " + s.nama;
    gambar.loading = "lazy";
    gambar.onerror = () => foto.replaceChildren(document.createTextNode(inisial(s.nama)));
    foto.appendChild(gambar);
  } else {
    foto.textContent = inisial(s.nama);
  }

  const idLabel = tipe === "guru" ? "NIP " : "NIS ";
  const idValue = s.nip || s.nis;

  isi.appendChild(foto);
  isi.appendChild(el("h2", "nama", s.nama));
  isi.appendChild(el("p", "nis", idLabel + idValue));

  const rincian = el("dl", "rincian");
  if (tipe === "siswa") {
    tambahBaris(rincian, "Kelas", s.kelas);
  }
  tambahBaris(rincian, "Mapel/Keahlian", s.mata_pelajaran);
  tambahBaris(rincian, "Jenis kelamin", s.jenis_kelamin);
  if (tipe === "siswa") {
    tambahBaris(rincian, "Tanggal lahir", formatTanggal(s.tanggal_lahir));
    tambahBaris(rincian, "Alamat", s.alamat);
  }
  
  isi.appendChild(rincian);
  kartu.appendChild(isi);

  // Aksi Tombol Edit & Hapus
  const aksi = el("div", "aksi-kartu");
  const btnEdit = el("button", "btn btn-secondary", "Edit");
  btnEdit.onclick = () => bukaModalEdit(s, tipe);
  
  const btnHapus = el("button", "btn btn-danger", "Hapus");
  btnHapus.onclick = () => hapusData(idValue, s.nama, tipe);

  aksi.appendChild(btnEdit);
  aksi.appendChild(btnHapus);
  kartu.appendChild(aksi);

  return kartu;
}

// --- CREATE & UPDATE DATA ---
formSiswa.addEventListener("submit", async (e) => {
  e.preventDefault();
  const tipeAktif = elTipe.value;
  const isEdit = Boolean(siswaIdOriginal.value);

  let payload = {};
  if (tipeAktif === "guru") {
    payload = {
      nip: inputNis.value.trim(),
      nama: inputNama.value.trim(),
      mata_pelajaran: inputMapel.value.trim(),
      jenis_kelamin: inputJK.value || null
    };
  } else {
    payload = {
      nis: inputNis.value.trim(),
      nama: inputNama.value.trim(),
      kelas: inputKelas.value.trim(),
      mata_pelajaran: inputMapel.value.trim(),
      jenis_kelamin: inputJK.value || null,
      tanggal_lahir: inputTglLahir.value || null,
      alamat: inputAlamat.value.trim() || null,
      foto_url: inputFoto.value.trim() || null
    };
  }

  const primaryKeyCol = tipeAktif === "guru" ? "nip" : "nis";

  if (isEdit) {
    // UPDATE
    const { error } = await db
      .from(tipeAktif)
      .update(payload)
      .eq(primaryKeyCol, siswaIdOriginal.value);

    if (error) {
      alert("Gagal mengubah data: " + error.message);
      return;
    }
  } else {
    // CREATE
    const { error } = await db
      .from(tipeAktif)
      .insert([payload]);

    if (error) {
      alert("Gagal menambahkan data: " + error.message);
      return;
    }
  }

  tutupModal();
  muatData();
});

// --- DELETE DATA ---
async function hapusData(idVal, nama, tipe) {
  if (!confirm(`Apakah Anda yakin ingin menghapus data "${nama}"?`)) {
    return;
  }
  const primaryKeyCol = tipe === "guru" ? "nip" : "nis";

  const { error } = await db
    .from(tipe)
    .delete()
    .eq(primaryKeyCol, idVal);

  if (error) {
    alert("Gagal menghapus data: " + error.message);
  } else {
    muatData();
  }
}

// --- MODAL UTILITIES ---
function bukaModalTambah() {
  const tipeAktif = elTipe.value;
  modalJudul.textContent = tipeAktif === "guru" ? "Tambah Data Guru" : "Tambah Data Siswa";
  siswaIdOriginal.value = "";
  formSiswa.reset();
  
  if (tipeAktif === "guru") {
    labelNis.textContent = "NIP *";
    grupKelas.style.display = "none";
    grupTglLahir.style.display = "none";
    grupAlamat.style.display = "none";
    grupFoto.style.display = "none";
  } else {
    labelNis.textContent = "NIS / NIP *";
    grupKelas.style.display = "flex";
    grupTglLahir.style.display = "flex";
    grupAlamat.style.display = "flex";
    grupFoto.style.display = "flex";
  }

  inputNis.removeAttribute("readonly");
  modalForm.classList.add("aktif");
}

function bukaModalEdit(s, tipe) {
  modalJudul.textContent = tipe === "guru" ? "Edit Data Guru" : "Edit Data Siswa";
  siswaIdOriginal.value = s.nip || s.nis;
  
  inputNis.value = s.nip || s.nis;
  inputNama.value = s.nama;
  inputMapel.value = s.mata_pelajaran || "";
  inputJK.value = s.jenis_kelamin || "";

  if (tipe === "guru") {
    labelNis.textContent = "NIP *";
    grupKelas.style.display = "none";
    grupTglLahir.style.display = "none";
    grupAlamat.style.display = "none";
    grupFoto.style.display = "none";
  } else {
    labelNis.textContent = "NIS / NIP *";
    grupKelas.style.display = "flex";
    grupTglLahir.style.display = "flex";
    grupAlamat.style.display = "flex";
    grupFoto.style.display = "flex";

    inputKelas.value = s.kelas || "";
    inputTglLahir.value = s.tanggal_lahir || "";
    inputAlamat.value = s.alamat || "";
    inputFoto.value = s.foto_url || "";
  }

  modalForm.classList.add("aktif");
}

function tutupModal() {
  modalForm.classList.remove("aktif");
}

btnTambah.onclick = bukaModalTambah;
btnBatal.onclick = tutupModal;
modalForm.onclick = (e) => { if (e.target === modalForm) tutupModal(); };

// --- HELPER FUNCTIONS ---
function el(tag, kelas, teks) {
  const e = document.createElement(tag);
  if (kelas) e.className = kelas;
  if (teks) e.textContent = teks;
  return e;
}

function tambahBaris(dl, label, nilai) {
  if (!nilai) return;
  const baris = el("div");
  baris.appendChild(el("dt", "", label));
  baris.appendChild(el("dd", "", nilai));
  dl.appendChild(baris);
}

function inisial(nama) {
  return nama ? nama.split(" ").filter(Boolean).slice(0, 2).map((k) => k[0].toUpperCase()).join("") : "?";
}

function formatTanggal(teks) {
  if (!teks) return "";
  return new Date(teks + "T00:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
}

function tampilkanPesan(teks, galat) {
  elDaftar.replaceChildren(el("p", "pesan" + (galat ? " galat" : ""), teks));
}

function isiPilihanKelas() {
  const kelasSaatIni = elKelas.value;
  elKelas.innerHTML = '<option value="">Semua kelas</option>';
  const daftarKelas = [...new Set(semuaData.map((s) => s.kelas).filter(Boolean))].sort();
  daftarKelas.forEach((k) => {
    const opsi = el("option", "", k);
    opsi.value = k;
    elKelas.appendChild(opsi);
  });
  elKelas.value = kelasSaatIni;
}

function isiPilihanMapel() {
  const mapelSaatIni = elMapel.value;
  elMapel.innerHTML = '<option value="">Semua Mapel</option>';
  const daftarMapel = [...new Set(semuaData.map((s) => s.mata_pelajaran).filter(Boolean))].sort();
  daftarMapel.forEach((m) => {
    const opsi = el("option", "", m);
    opsi.value = m;
    elMapel.appendChild(opsi);
  });
  elMapel.value = mapelSaatIni;
}

elCari.addEventListener("input", tampilkanData);
elKelas.addEventListener("change", tampilkanData);
elMapel.addEventListener("change", tampilkanData);

elTipe.addEventListener("change", (e) => {
  const tipe = e.target.value;
  if (tipe === "guru") {
    elKelas.style.display = "none";
    elKelas.value = "";
  } else {
    elKelas.style.display = "inline-block";
  }
  muatData();
});

muatData();
</script>
</body>
</html>
